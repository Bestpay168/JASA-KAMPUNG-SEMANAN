<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - JASA KAMPUNG</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .admin-header {
            background: #111;
            color: white;
            padding: 20px;
        }

        .admin-header h1 {
            font-size: 22px;
        }

        .admin-header p {
            margin-top: 5px;
            opacity: .7;
            font-size: 14px;
        }

        .container {
            width: min(100% - 30px, 900px);
            margin: 25px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .stat span {
            font-size: 13px;
            color: #777;
        }

        .order-card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .order-code {
            font-weight: bold;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .menunggu {
            background: #fff3cd;
            color: #856404;
        }

        .diproses {
            background: #cfe2ff;
            color: #084298;
        }

        .selesai {
            background: #d1e7dd;
            color: #0f5132;
        }

        .dibatalkan {
            background: #f8d7da;
            color: #842029;
        }

        .order-info {
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .order-info b {
            color: #333;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            border: 0;
            padding: 10px 13px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-process {
            background: #cfe2ff;
            color: #084298;
        }

        .btn-done {
            background: #d1e7dd;
            color: #0f5132;
        }

        .btn-cancel {
            background: #f8d7da;
            color: #842029;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 16px;
            color: #777;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="admin-header">
    <h1>JASA KAMPUNG</h1>
    <p>Panel Admin Pesanan</p>
</header>

<main class="container">

    <section class="stats">
        <div class="stat">
            <strong id="totalOrders">0</strong>
            <span>Total Pesanan</span>
        </div>

        <div class="stat">
            <strong id="waitingOrders">0</strong>
            <span>Menunggu</span>
        </div>

        <div class="stat">
            <strong id="doneOrders">0</strong>
            <span>Selesai</span>
        </div>
    </section>

    <section id="ordersList"></section>

</main>

<script src="admin.js"></script>

</body>
</html>
