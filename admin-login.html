<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - JASA KAMPUNG</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #111;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            margin: 8px 0 25px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #111;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            margin-top: 5px;
            border: 0;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:active {
            transform: scale(.98);
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #f8d7da;
            color: #842029;
            font-size: 13px;
            text-align: center;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        JK
    </div>

    <h1>JASA KAMPUNG</h1>

    <p class="subtitle">
        Login Administrator
    </p>

    <div id="loginError" class="error">
        Username atau password salah.
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                placeholder="Masukkan username"
                required
            >
        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    placeholder="Masukkan password"
                    required
                >

                <button
                    type="button"
                    id="showPassword"
                    class="show-password"
                    aria-label="Tampilkan password">
                    👁️
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="login-btn">
            🔐 LOGIN ADMIN
        </button>

    </form>

    <div class="footer">
        © 2026 JASA KAMPUNG
    </div>

</div>

<script src="admin-login.js"></script>

</body>
</html>
